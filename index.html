<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alcázar de Salamanca</title>
    
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet" />
    
    <script type="importmap">
    {
      "imports": {
        "jspdf": "https://esm.sh/jspdf@2.5.1",
        "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.5.25",
        "xlsx": "https://esm.sh/xlsx@0.18.5",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
      }
    }
    </script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: "#3b82f6" } // Celeste original
          }
        }
      };
    </script>

    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; }

      /* SOLUCIÓN PARA VERCEL: Recupera el input oculto */
      #n8n-chat-render-area, .n8n-chat-widget {
        height: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
      }

      /* Obliga a los mensajes a dejar espacio al input field */
      .n8n-chat-widget-messages {
        flex: 1 1 auto !important;
        height: auto !important;
      }

      /* Asegura que el área de escritura siempre sea visible */
      .n8n-chat-widget-input {
        display: flex !important;
        min-height: 60px !important;
        background: white !important;
        border-top: 1px solid #f1f5f9 !important;
      }

      /* Estilo del Header Celeste */
      .n8n-chat-widget-header {
        background-color: #3b82f6 !important;
        padding: 8px 16px !important;
        min-height: 50px !important;
      }
      .n8n-chat-widget-header-title, .n8n-chat-widget-header-subtitle { color: white !important; }

      :root { --n8n-chat-primary-color: #3b82f6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
